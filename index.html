<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>한국폴리텍대학 교과과정 개편 세부기준 검수 프로그램</title>
  <meta name="description" content="한국폴리텍대학 운영과정별 교과편성 세부기준 설정 및 커리큘럼 적합성 검수 프로그램">
  <!-- Pretendard 웹폰트 (없으면 시스템 한글 폰트로 자동 대체) -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="assets/css/styles.css?v=1.5.2">
</head>
<body>
  <div class="app-shell">
    <!-- 상단바 (시작 페이지에서는 숨김) -->
    <header class="topbar" id="topbar" style="display:none">
      <div class="brand" onclick="navigate('home')" title="시작 페이지로">
        <span class="logo-badge">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11l3 3L22 4"/>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
          </svg>
        </span>
        <span class="brand-text">
          <b id="brandTitle">한국폴리텍대학</b>
          <span id="brandSub">교과과정 개편 세부기준 검수 프로그램</span>
        </span>
      </div>
      <div class="spacer"></div>
      <span id="adminArea" style="display:flex;gap:8px"></span>
      <button class="home-btn" onclick="exportAllData()" title="현재 저장된 모든 설정·데이터를 파일로 내보내기">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>
        </svg>
        데이터 내보내기
      </button>
      <button class="home-btn" onclick="$('#importDataFile').click()" title="내보낸 데이터 파일을 불러와 이 브라우저에 복원">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/>
        </svg>
        데이터 가져오기
      </button>
      <input type="file" id="importDataFile" accept=".json" style="display:none" onchange="importAllData(event)">
      <button class="home-btn" onclick="navigate('history')" title="저장된 검수결과 내역 보기">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/>
        </svg>
        검수내역
      </button>
      <button class="home-btn" onclick="navigate('home')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M9 22V12h6v10"/>
        </svg>
        처음으로
      </button>
    </header>

    <!-- 화면이 렌더링되는 영역 -->
    <main class="main" id="app"></main>
  </div>

  <!-- 토스트 -->
  <div class="toast" id="toast"></div>

  <!-- 관리자 로그인 모달 -->
  <div id="adminModal" style="display:none;position:fixed;inset:0;z-index:999;background:rgba(10,14,25,.55);align-items:center;justify-content:center;">
    <div style="background:#fff;border-radius:14px;padding:28px 26px;width:320px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.35);">
      <h3 style="margin:0 0 6px;font-size:18px;">관리자 로그인</h3>
      <p style="margin:0 0 16px;font-size:13px;color:#666;line-height:1.5;">세부기준 설정 및 교과목 등록 기능은 관리자만 이용할 수 있습니다.<br>관리자 비밀번호를 입력해주세요. (초기값: 1234)</p>
      <input type="password" id="adminPwInput" placeholder="관리자 비밀번호"
             style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin-bottom:16px;"
             onkeydown="if(event.key==='Enter'){submitAdminLogin();}">
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button class="btn btn-ghost" onclick="closeAdminModal(true)">취소</button>
        <button class="btn btn-primary" onclick="submitAdminLogin()">로그인</button>
      </div>
    </div>
  </div>

  <!-- 스크립트 (순서 중요) -->
  <script src="assets/vendor/pdf.min.js"></script>
  <script src="assets/vendor/jspdf.umd.min.js"></script>
  <script src="assets/vendor/html2canvas.min.js"></script>
  <!-- Firebase (백엔드 연동, firebase-config.js 미설정 시 자동 비활성화) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="assets/js/firebase-config.js?v=1.0.1"></script>
  <script src="assets/js/data.js?v=1.6.3"></script>
  <script src="assets/js/hero-art.js?v=1.5.3"></script>
  <script src="assets/js/pdf-roadmap.js?v=1.5.3"></script>
  <script src="assets/js/app.js?v=1.6.3"></script>
  <script src="assets/js/firebase-sync.js?v=1.0.1"></script>
</body>
</html>
